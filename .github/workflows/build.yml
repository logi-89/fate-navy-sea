name: Build Executable

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      build-tool:
        description: Build tool to use
        required: true
        default: nuitka
        type: choice
        options:
          - nuitka
          - pyinstaller

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact-name: linux
          - os: macos-latest
            artifact-name: macos
          - os: windows-latest
            artifact-name: windows

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select build tool
        id: tool
        run: echo "name=${{ inputs.build-tool || 'nuitka' }}" >> $GITHUB_OUTPUT

      - name: Build with Nuitka
        if: steps.tool.outputs.name == 'nuitka'
        uses: Nuitka/Nuitka-Action@main
        with:
          script-name: main.py
          mode: app
          output-dir: build
          output-file: fate-navy-sea
          enable-console: true

      - name: Build with PyInstaller
        if: steps.tool.outputs.name == 'pyinstaller'
        run: |
          pip install pyinstaller
          case "$RUNNER_OS" in
            Windows) sep=";" ;;
            *) sep=":" ;;
          esac
          pyinstaller --onefile --name "fate-navy-sea" \
            --hidden-import pygame \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fate-navy-sea-${{ steps.tool.outputs.name }}-${{ matrix.artifact-name }}
          path: |
            build/fate-navy-sea*
            build/*.app
            dist/fate-navy-sea*
