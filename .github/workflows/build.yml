name: Build Executable

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      build-tool:
        description: Build tool to use
        required: true
        default: nuitka
        type: choice
        options:
          - nuitka
          - pyinstaller

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact-name: linux
          - os: macos-latest
            artifact-name: macos
          - os: windows-latest
            artifact-name: windows

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select build tool
        id: tool
        run: echo "name=${{ inputs.build-tool || 'nuitka' }}" >> $GITHUB_OUTPUT

      - name: Build with Nuitka
        if: steps.tool.outputs.name == 'nuitka'
        run: |
          pip install nuitka
          # Collect data directories (those with uppercase letters)
          DATA_ARGS=()
          for dir in */; do
            d="${dir%/}"
            if echo "$d" | grep -qE '[A-Z]'; then
              DATA_ARGS+=(--include-data-dir="$d=$d")
            fi
          done
          DATA_ARGS+=(--include-data-files="helper/mr shopKeeper.png=helper/")
          DATA_ARGS+=(--include-data-files="F4T3_ navy sea.mp3=./")
          DATA_ARGS+=(--include-data-files="escalator music.mp3=./")
          nuitka --mode=app \
            --output-file=fate-navy-sea \
            "${DATA_ARGS[@]}" main.py

      - name: Build with PyInstaller
        if: steps.tool.outputs.name == 'pyinstaller'
        run: |
          pip install pyinstaller
          case "$RUNNER_OS" in
            Windows) sep=";" ;;
            *) sep=":" ;;
          esac
          # Collect data directories (those with uppercase letters)
          DATA_ARGS=()
          for dir in */; do
            d="${dir%/}"
            if echo "$d" | grep -qE '[A-Z]'; then
              DATA_ARGS+=(--add-data "$d${sep}$d")
            fi
          done
          DATA_ARGS+=(--add-data "helper/mr shopKeeper.png${sep}helper")
          DATA_ARGS+=(--add-data "F4T3_ navy sea.mp3${sep}.")
          DATA_ARGS+=(--add-data "escalator music.mp3${sep}.")
          pyinstaller --onefile --name "fate-navy-sea" \
            --hidden-import pygame \
            "${DATA_ARGS[@]}" \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fate-navy-sea-${{ steps.tool.outputs.name }}-${{ matrix.artifact-name }}
          path: |
            *.app
            main*
            dist/fate-navy-sea*
